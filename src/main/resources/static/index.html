<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LankaConnect | Web-Based Customer Care System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-5 card-custom" style="max-width: 500px;">
        <div class="mb-4">
            <span class="brand-badge fs-4 px-3 py-2"><i class="bi bi-headset me-2"></i>LankaConnect CCMS</span>
        </div>
        <div class="spinner-border text-primary my-4" role="status"></div>
        <h5 class="text-dark fw-bold">Loading Customer Care System...</h5>
        <p class="text-muted small">Redirecting to secure login portal...</p>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await App.initAuth();
            if (user) {
                App.redirectUserByRole(user.role);
            } else {
                window.location.href = '/login.html';
            }
        });
    </script>
</body>
</html>
